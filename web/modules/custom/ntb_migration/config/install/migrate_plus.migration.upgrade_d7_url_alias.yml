        - upgrade_d7_node_complete_simplenews
        - upgrade_d7_node_complete_slideshow
        - upgrade_d7_node_complete_snils
        - upgrade_d7_node_complete_webform
    -
      plugin: node_complete_node_translation_lookup
  langcode:
    -
      plugin: null_coalesce
      source:
        - '@node_translation/1'
        - language
  path:
    -
      plugin: path_set_translated
      source:
        - '@_path'
        - '@node_translation'
destination:
  plugin: 'entity:path_alias'
